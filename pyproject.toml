# Fusion Equilibrium Challenge — diagnostic publication checks
[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true
files = [
    "experiments/d71_finisher_physics/per_shot_table.py",
    "tools/check_doc_links.py",
    "tools/ci_check_shot.py",
    "tools/d71b_table.py",
    "tools/d72_table.py",
    "tools/surface_gs.py",
    "tools/surface_support_summary.py",
    "tools/surface_support_table.py",
    "tools/make_preview.py",
    "tools/check_publication_boundary.py",
    "tests/test_d71_table.py",
    "tests/test_d71b_table.py",
    "tests/test_d72_table.py",
    "tests/test_surface_gs.py",
    "tests/test_surface_support_summary.py",
    "tests/test_surface_support_table.py",
    "tests/test_make_preview.py",
    "tests/test_check_publication_boundary.py",
    "tests/test_check_doc_links.py",
    "tests/test_ci_check_shot.py",
    "tests/test_licensing.py",
]

[tool.coverage.run]
branch = true
source = ["experiments/d71_finisher_physics", "tools"]

[tool.coverage.report]
fail_under = 100
show_missing = true
include = [
    "experiments/d71_finisher_physics/per_shot_table.py",
    "tools/check_doc_links.py",
    "tools/ci_check_shot.py",
    "tools/d71b_table.py",
    "tools/d72_table.py",
    "tools/surface_gs.py",
    "tools/surface_support_summary.py",
    "tools/surface_support_table.py",
    "tools/make_preview.py",
    "tools/check_publication_boundary.py",
]
