# Fusion Equilibrium Challenge — staged source checks
repos:
  - repo: local
    hooks:
      - id: staged-secrets
        name: Scan staged changes for secrets
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
      - id: d71-ruff
        name: Check maintained verifiers and their tests
        entry: .venv/bin/ruff check
        language: system
        files: ^(experiments/d71_finisher_physics/per_shot_table|tools/(check_doc_links|ci_check_shot|d71b_table|d72_table|surface_gs|surface_support_summary|surface_support_table|make_preview|check_publication_boundary)|tests/test_(d71_table|d71b_table|d72_table|surface_gs|surface_support_summary|surface_support_table|make_preview|check_publication_boundary|check_doc_links|ci_check_shot|licensing))\.py$
      - id: d71-format
        name: Check maintained verifier formatting
        entry: .venv/bin/ruff format --check
        language: system
        files: ^(experiments/d71_finisher_physics/per_shot_table|tools/(check_doc_links|ci_check_shot|d71b_table|d72_table|surface_gs|surface_support_summary|surface_support_table|make_preview|check_publication_boundary)|tests/test_(d71_table|d71b_table|d72_table|surface_gs|surface_support_summary|surface_support_table|make_preview|check_publication_boundary|check_doc_links|ci_check_shot|licensing))\.py$
      - id: d71-mypy
        name: Check maintained verifier types
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        files: ^(experiments/d71_finisher_physics/per_shot_table|tools/(check_doc_links|ci_check_shot|d71b_table|d72_table|surface_gs|surface_support_summary|surface_support_table|make_preview|check_publication_boundary)|tests/test_(d71_table|d71b_table|d72_table|surface_gs|surface_support_summary|surface_support_table|make_preview|check_publication_boundary|check_doc_links|ci_check_shot|licensing)|pyproject)\.(py|toml)$
      - id: publication-boundary
        name: Refuse private records in staged and public files
        entry: .venv/bin/python tools/check_publication_boundary.py
        language: system
        pass_filenames: false
        always_run: true
