# Fusion Equilibrium Challenge — staged source checks
repos:
  - repo: local
    hooks:
      - id: staged-secrets
        name: Scan staged changes for secrets
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
      - id: d71-ruff
        name: Check the maintained D71 table verifier
        entry: .venv/bin/ruff check
        language: system
        files: ^(experiments/d71_finisher_physics/per_shot_table|tests/test_d71_table)\.py$
      - id: d71-format
        name: Check D71 verifier formatting
        entry: .venv/bin/ruff format --check
        language: system
        files: ^(experiments/d71_finisher_physics/per_shot_table|tests/test_d71_table)\.py$
      - id: d71-mypy
        name: Check D71 verifier types
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        files: ^(experiments/d71_finisher_physics/per_shot_table|tests/test_d71_table|pyproject)\.(py|toml)$
