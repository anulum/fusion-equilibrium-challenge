# Fusion Equilibrium Challenge — links in the actual public source projection
name: Docs links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check repository documents and Pages without private working files
        run: |
          mkdir "$RUNNER_TEMP/public-docs"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/public-docs"
          test ! -e "$RUNNER_TEMP/public-docs/docs/internal"
          python tools/check_doc_links.py --docs-root "$RUNNER_TEMP/public-docs"
          python tools/check_doc_links.py --docs-root "$RUNNER_TEMP/public-docs/docs"
