# Fusion Equilibrium Challenge — read-only project security posture record
name: Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Upstream action v2.5.0 uses a mutable container tag; bind its published OCI index instead.
      - uses: docker://ghcr.io/ossf/scorecard-action@sha256:1e1481c65fc2407d3fd6ab18a23c741eb4d1c0d9359ebafc4b3ab13aa61d8627
        env:
          INPUT_RESULTS_FILE: scorecard.json
          INPUT_RESULTS_FORMAT: json
          INPUT_FILE_MODE: archive
          INPUT_PUBLISH_RESULTS: "false"
          INPUT_REPO_TOKEN: ${{ github.token }}
          INPUT_INTERNAL_DEFAULT_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard
          path: scorecard.json
          if-no-files-found: error
          retention-days: 30
