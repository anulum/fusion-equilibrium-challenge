# Fusion Equilibrium Challenge — public diagnostic and dependency verification
name: Diagnostics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  table-verifier:
    runs-on: ubuntu-24.04
    # Complete 20,000-draw diagnostic reproduction and real-data refusal probes.
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Keep the submitted numerical source and model identities frozen
        run: |
          make frozen
          mkdir "$RUNNER_TEMP/frozen-probe"
          git archive HEAD source training_adapter infer.py train.py tree_replica.py deployment.json training_recipe.json WEIGHTS.json WEIGHTS.sha256 | tar -x -C "$RUNNER_TEMP/frozen-probe"
          cp Makefile "$RUNNER_TEMP/frozen-probe/Makefile"
          printf '\n' >> "$RUNNER_TEMP/frozen-probe/infer.py"
          if GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE="$RUNNER_TEMP/frozen-probe" GIT_OPTIONAL_LOCKS=0 make -C "$RUNNER_TEMP/frozen-probe" frozen; then
            echo 'Altered numerical source unexpectedly passed the frozen-source check.' >&2
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.21"
      - run: uv pip install --system --require-hashes -r requirements-quality.txt
      - name: Check maintained diagnostic source and tests
        run: |
          ruff check experiments/d71_finisher_physics/per_shot_table.py tests/test_d71_table.py
          ruff format --check experiments/d71_finisher_physics/per_shot_table.py tests/test_d71_table.py
          ruff check tools/check_doc_links.py tools/ci_check_shot.py tools/d71b_table.py tools/d72_table.py tools/surface_gs.py tools/surface_support_summary.py tools/surface_support_table.py tools/scored_map_summary.py tools/scored_map_table.py tools/audit_map_input.py tools/field_diagnostics.py tools/equilibrium_audit.py tools/make_preview.py tools/check_publication_boundary.py tests/test_d71b_table.py tests/test_d72_table.py tests/test_surface_gs.py tests/test_surface_support_summary.py tests/test_surface_support_table.py tests/test_scored_map_summary.py tests/test_scored_map_table.py tests/test_audit_map_input.py tests/test_field_diagnostics.py tests/test_equilibrium_audit.py tests/test_make_preview.py tests/test_check_publication_boundary.py tests/test_check_doc_links.py tests/test_ci_check_shot.py tests/test_licensing.py
          ruff format --check tools/check_doc_links.py tools/ci_check_shot.py tools/d71b_table.py tools/d72_table.py tools/surface_gs.py tools/surface_support_summary.py tools/surface_support_table.py tools/scored_map_summary.py tools/scored_map_table.py tools/audit_map_input.py tools/field_diagnostics.py tools/equilibrium_audit.py tools/make_preview.py tools/check_publication_boundary.py tests/test_d71b_table.py tests/test_d72_table.py tests/test_surface_gs.py tests/test_surface_support_summary.py tests/test_surface_support_table.py tests/test_scored_map_summary.py tests/test_scored_map_table.py tests/test_audit_map_input.py tests/test_field_diagnostics.py tests/test_equilibrium_audit.py tests/test_make_preview.py tests/test_check_publication_boundary.py tests/test_check_doc_links.py tests/test_ci_check_shot.py tests/test_licensing.py
          mypy
          bandit -q experiments/d71_finisher_physics/per_shot_table.py
          bandit -q tools/check_doc_links.py tools/ci_check_shot.py tools/d71b_table.py tools/d72_table.py tools/surface_gs.py tools/surface_support_summary.py tools/surface_support_table.py tools/scored_map_summary.py tools/scored_map_table.py tools/audit_map_input.py tools/field_diagnostics.py tools/equilibrium_audit.py tools/make_preview.py tools/check_publication_boundary.py
          reuse lint
      - name: Check the exact public source projection
        run: python tools/check_publication_boundary.py
      - name: Recompute the public table and reject corrupt inputs
        run: |
          python -m coverage run --parallel-mode -m pytest -q tests/test_d71_table.py tests/test_d71b_table.py tests/test_d72_table.py tests/test_surface_gs.py tests/test_surface_support_summary.py tests/test_surface_support_table.py tests/test_scored_map_summary.py tests/test_scored_map_table.py tests/test_audit_map_input.py tests/test_field_diagnostics.py tests/test_equilibrium_audit.py tests/test_make_preview.py tests/test_check_publication_boundary.py tests/test_check_doc_links.py tests/test_ci_check_shot.py tests/test_licensing.py
          python -m coverage combine
          python -m coverage report
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - requirements: requirements-inference-cpu.txt
            service: pypi
          - requirements: requirements-training-cpu.txt
            service: osv
          - requirements: requirements-training-cuda.txt
            service: osv
          - requirements: requirements-quality.txt
            service: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.21"
      - run: uv pip install --system --require-hashes -r requirements-quality.txt
      - name: Audit every dependency, including transitive requirements
        run: pip-audit --strict --vulnerability-service "${{ matrix.service }}" --progress-spinner off -r "${{ matrix.requirements }}" --format cyclonedx-json --output "sbom-resolved-${{ matrix.requirements }}.json"
      - name: Audit and inventory every locked version, including resolver bootstrap packages
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
          AUDIT_SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          sed -nE \
            -e 's/^([A-Za-z0-9_.-]+)==([^[:space:]]+).*$/\1==\2/p' \
            -e 's|^torch @ https://download-r2.pytorch.org/whl/cpu/torch-([0-9.]+)%2Bcpu-.*$|torch==\1+cpu|p' \
            "$REQUIREMENTS" > "$RUNNER_TEMP/locked-versions.txt"
          test "$(wc -l < "$RUNNER_TEMP/locked-versions.txt")" -gt 0
          test "$(wc -l < "$RUNNER_TEMP/locked-versions.txt")" -eq "$(grep -cE '^[A-Za-z0-9_.-]+(==| @ )' "$REQUIREMENTS")"
          pip-audit --strict --disable-pip --no-deps --vulnerability-service "$AUDIT_SERVICE" \
            --progress-spinner off -r "$RUNNER_TEMP/locked-versions.txt" \
            --format cyclonedx-json --output "sbom-$REQUIREMENTS.json"
          awk -F '==' '{gsub(/[_.]/, "-", $1); print tolower($1) "==" $2}' "$RUNNER_TEMP/locked-versions.txt" | sort > "$RUNNER_TEMP/expected-versions.txt"
          jq -r '.components[] | .name + "==" + .version' "sbom-$REQUIREMENTS.json" | \
            awk -F '==' '{gsub(/[_.]/, "-", $1); print tolower($1) "==" $2}' | sort > "$RUNNER_TEMP/sbom-versions.txt"
          diff -u "$RUNNER_TEMP/expected-versions.txt" "$RUNNER_TEMP/sbom-versions.txt"
      - name: Also check the upstream PyTorch advisory version
        if: matrix.service == 'osv'
        # Some advisories enumerate the public version without its CPU build tag.
        run: |
          sed -n 's|^torch @ https://download-r2.pytorch.org/whl/cpu/torch-\([0-9.]*\)%2Bcpu-.*$|torch==\1|p' "${{ matrix.requirements }}" > "$RUNNER_TEMP/torch-upstream.txt"
          test "$(wc -l < "$RUNNER_TEMP/torch-upstream.txt")" -eq 1
          pip-audit --strict --disable-pip --no-deps --progress-spinner off -r "$RUNNER_TEMP/torch-upstream.txt"
      - name: Retain the audited dependency inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-${{ matrix.requirements }}
          path: |
            sbom-${{ matrix.requirements }}.json
            sbom-resolved-${{ matrix.requirements }}.json
          if-no-files-found: error
          retention-days: 30
  provenance:
    needs: [table-verifier, dependency-audit]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sbom-*
          merge-multiple: true
      - name: Archive the exact public source object
        run: |
          python3 tools/check_publication_boundary.py
          git archive --format=tar --prefix=fusion-equilibrium-challenge/ HEAD | gzip -n > source.tar.gz
          sha256sum source.tar.gz > source.sha256
          git --version
          gzip --version
          gh --version
      - name: Attest the checked source and audited inventories
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            source.tar.gz
            sbom-*.json
      - name: Verify producer, source object and every subject digest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" attestation.jsonl
          for subject in source.tar.gz sbom-*.json; do
            gh attestation verify "$subject" --bundle attestation.jsonl \
              --repo "$SOURCE_REPOSITORY" --source-digest "$SOURCE_SHA" \
              --source-ref refs/heads/main --deny-self-hosted-runners \
              --signer-workflow "$SOURCE_REPOSITORY/.github/workflows/diagnostics.yml" \
              --format json > "$subject.verification.json"
          done
          cp source.tar.gz altered-source.tar.gz
          printf '\0' >> altered-source.tar.gz
          if gh attestation verify altered-source.tar.gz --bundle attestation.jsonl \
            --repo "$SOURCE_REPOSITORY" --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main --deny-self-hosted-runners \
            --signer-workflow "$SOURCE_REPOSITORY/.github/workflows/diagnostics.yml" 2> altered-refusal.txt; then
            echo 'Altered source unexpectedly passed attestation verification.' >&2
            exit 1
          fi
          gh attestation verify source.tar.gz --bundle attestation.jsonl \
            --repo "$SOURCE_REPOSITORY" --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main --deny-self-hosted-runners \
            --signer-workflow "$SOURCE_REPOSITORY/.github/workflows/diagnostics.yml" \
            --format json > restored-source.verification.json
          if gh attestation verify source.tar.gz --bundle attestation.jsonl \
            --repo "$SOURCE_REPOSITORY" --source-digest 0000000000000000000000000000000000000000 \
            --source-ref refs/heads/main --deny-self-hosted-runners \
            --signer-workflow "$SOURCE_REPOSITORY/.github/workflows/diagnostics.yml" 2> wrong-source-refusal.txt; then
            echo 'Incorrect source commit unexpectedly passed attestation verification.' >&2
            exit 1
          fi
          gh attestation verify source.tar.gz --bundle attestation.jsonl \
            --repo "$SOURCE_REPOSITORY" --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main --deny-self-hosted-runners \
            --signer-workflow "$SOURCE_REPOSITORY/.github/workflows/diagnostics.yml" \
            --format json > restored-policy.verification.json
          rm altered-source.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-source-and-sboms
          path: |
            source.tar.gz
            source.sha256
            sbom-*.json
            attestation.jsonl
            *.verification.json
            altered-refusal.txt
            wrong-source-refusal.txt
          if-no-files-found: error
          retention-days: 30
